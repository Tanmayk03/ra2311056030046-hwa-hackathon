<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     viewBox="0 0 720 540" width="720" height="540"
     role="img" aria-labelledby="hwa-title">
  <title id="hwa-title">Happy While Away golden retriever – playful bow</title>
  <desc>Happy While Away golden retriever puppy. Transparent background. Animatable groups carry
    id, class, data-anim and data-origin. Origins are in each group's local user units.</desc>
  <defs>
    <linearGradient id="hwa-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C76B"/>
      <stop offset="0.6" stop-color="#EFAE4C"/>
      <stop offset="1" stop-color="#E0993A"/>
    </linearGradient>
    <linearGradient id="hwa-fur-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E29A3A"/>
      <stop offset="1" stop-color="#C97A26"/>
    </linearGradient>
    <linearGradient id="hwa-cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E3"/>
      <stop offset="1" stop-color="#FBE2B2"/>
    </linearGradient>
    <radialGradient id="hwa-iris" cx="0.45" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#A2622E"/>
      <stop offset="1" stop-color="#4A2513"/>
    </radialGradient>
    <linearGradient id="hwa-nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55352A"/>
      <stop offset="1" stop-color="#1E120D"/>
    </linearGradient>
    <linearGradient id="hwa-tongue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8A3B0"/>
      <stop offset="1" stop-color="#E06F80"/>
    </linearGradient>
    <clipPath id="hwa-eye-clip-left"><ellipse cx="-40" cy="-8" rx="22" ry="24"/></clipPath>
    <clipPath id="hwa-eye-clip-right"><ellipse cx="40" cy="-8" rx="22" ry="24"/></clipPath>
  </defs>
  <g id="dog" class="hwa-dog" inkscape:label="dog (root)" data-anim="bounce (translateY -12px), enter" data-origin="410 492" style="transform-box:view-box;transform-origin:410px 492px">
    <g id="shadow" class="hwa-shadow" inkscape:label="ground shadow (optional)">
      <ellipse cx="410" cy="492" rx="230" ry="12" fill="#12243A" opacity="0.13"/>
    </g>
        <g id="tail" class="hwa-tail" inkscape:label="tail (raised)" data-anim="fast wag (rotate -22deg to 22deg)" data-origin="574 232" style="transform-box:view-box;transform-origin:574px 232px">
          <path d="M 586 238 C 612 210 630 168 618 126 C 614 112 600 110 594 120 C 592 126 596 132 596 140 C 600 170 588 200 566 228 Z" fill="url(#hwa-fur)" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
        <g id="back-legs" class="hwa-back-legs" inkscape:label="back legs (up)" data-anim="hop (translateY)" data-origin="546 290" style="transform-box:view-box;transform-origin:546px 290px">
          <path d="M 498 472 C 495 432 496 312 501 298 C 507 286 529 286 535 298 C 540 312 541 432 538 472 Z" fill="url(#hwa-fur-dark)" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <ellipse cx="518" cy="475" rx="25" ry="12" fill="#FBDDA0" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 509.667 473.2 v 9 M 526.333 473.2 v 9" fill="none" stroke="#A8611F" stroke-width="2" stroke-linecap="round"/>
          <path d="M 544 478 C 541 438 542 302 547 288 C 553 276 583 276 589 288 C 594 302 595 438 592 478 Z" fill="url(#hwa-fur)" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <ellipse cx="568" cy="481" rx="28" ry="13" fill="#FBDDA0" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 558.667 479.05 v 9.75 M 577.333 479.05 v 9.75" fill="none" stroke="#A8611F" stroke-width="2" stroke-linecap="round"/>
        </g>
        <g id="body" class="hwa-body" inkscape:label="body (bowed)" data-anim="wiggle (rotate ±3deg)" data-origin="430 432" style="transform-box:view-box;transform-origin:430px 432px">
          <path d="M 270 360 C 300 300 450 220 540 214 C 600 210 616 282 588 318 C 544 374 420 420 340 432 C 280 440 250 400 270 360 Z" fill="url(#hwa-fur)" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 548 228 C 596 226 606 290 578 316 C 556 334 526 318 524 290 C 522 262 528 234 548 228 Z" fill="#E39E3E" opacity="0.55"/>
        </g>
        <g id="front-legs" class="hwa-front-legs" inkscape:label="front legs (bowed down)" data-anim="pounce (translate)" data-origin="304 478" style="transform-box:view-box;transform-origin:304px 478px">
          <path d="M 228 478 C 225 438 226 394 231 380 C 237 368 267 368 273 380 C 278 394 279 438 276 478 Z" fill="url(#hwa-fur)" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <ellipse cx="252" cy="482" rx="34" ry="15" fill="#FBDDA0" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 240.667 479.75 v 11.25 M 263.333 479.75 v 11.25" fill="none" stroke="#A8611F" stroke-width="2" stroke-linecap="round"/>
          <path d="M 330 478 C 327 438 328 394 333 380 C 339 368 369 368 375 380 C 380 394 381 438 378 478 Z" fill="url(#hwa-fur)" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <ellipse cx="354" cy="482" rx="34" ry="15" fill="#FBDDA0" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 342.667 479.75 v 11.25 M 365.333 479.75 v 11.25" fill="none" stroke="#A8611F" stroke-width="2" stroke-linecap="round"/>
        </g>
    <g id="head-rig" class="hwa-head-rig" inkscape:label="head rig (position / pose)" transform="translate(304 268) rotate(10 0 80)">
      <g id="head" class="hwa-head" inkscape:label="head" data-anim="tilt (rotate ±12deg), nod" data-origin="0 80" style="transform-box:view-box;transform-origin:0px 80px">
