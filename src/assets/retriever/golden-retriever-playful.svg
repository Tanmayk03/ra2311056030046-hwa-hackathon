          <path d="M -16 -86 C -16 -102 -4 -110 2 -100 C 6 -112 20 -110 18 -96 C 24 -100 28 -94 22 -86 Z" fill="url(#hwa-fur)" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 0 -90 C 60 -90 100 -54 102 -4 C 103 22 98 44 88 58 L 102 66 L 84 72 L 92 84 L 70 82 C 52 92 26 96 0 96 C -26 96 -52 92 -70 82 L -92 84 L -84 72 L -102 66 L -88 58 C -98 44 -103 22 -102 -4 C -100 -54 -60 -90 0 -90 Z" fill="url(#hwa-fur)" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M 0 -72 C 32 -72 72 -42 76 0 C 78 30 50 40 0 40 C -50 40 -78 30 -76 0 C -72 -42 -32 -72 0 -72 Z" fill="#FAD58A" opacity="0.55"/>
          <path d="M -54 44 C -56 16 -30 4 0 8 C 30 4 56 16 54 44 C 52 72 28 90 0 90 C -28 90 -52 72 -54 44 Z" fill="url(#hwa-cream)"/>
        </g>
        <g id="ear-left-rig" class="hwa-ear-left-rig" inkscape:label="ear left rig (pose)" transform="rotate(18 -58 -64)">
          <g id="ear-left" class="hwa-ear-left" inkscape:label="ear left" data-anim="flop (rotate ±8deg)" data-origin="-58 -64" style="transform-box:view-box;transform-origin:-58px -64px">
            <path d="M -52 -68 C -86 -84 -126 -62 -134 -20 C -140 16 -130 56 -108 66 C -96 72 -90 64 -86 50 C -82 30 -86 4 -80 -22 C -76 -38 -70 -50 -62 -58 Z" fill="url(#hwa-fur-dark)" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M -104 -40 C -120 -14 -122 26 -110 54 C -104 32 -102 2 -96 -22 Z" fill="#B96B1F" opacity="0.22"/>
          </g>
        </g>
        <g id="ear-right-rig" class="hwa-ear-right-rig" inkscape:label="ear right rig (pose)" transform="rotate(-18 58 -64)">
          <g id="ear-right" class="hwa-ear-right" inkscape:label="ear right" data-anim="flop (rotate ±8deg)" data-origin="58 -64" style="transform-box:view-box;transform-origin:58px -64px">
            <path d="M 52 -68 C 86 -84 126 -62 134 -20 C 140 16 130 56 108 66 C 96 72 90 64 86 50 C 82 30 86 4 80 -22 C 76 -38 70 -50 62 -58 Z" fill="url(#hwa-fur-dark)" stroke="#A8611F" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M 104 -40 C 120 -14 122 26 110 54 C 104 32 102 2 96 -22 Z" fill="#B96B1F" opacity="0.22"/>
          </g>
        </g>
        <g id="blush" class="hwa-blush" inkscape:label="cheek blush">
          <ellipse cx="-66" cy="34" rx="13" ry="8" fill="#F59E86" opacity="0.4"/>
          <ellipse cx="66" cy="34" rx="13" ry="8" fill="#F59E86" opacity="0.4"/>
        </g>
        <g id="eye-left" class="hwa-eye-left" inkscape:label="eye left" data-anim="blink (scaleY 1 -> 0.1 -> 1)" data-origin="-40 -8" style="transform-box:view-box;transform-origin:-40px -8px">
          <ellipse cx="-40" cy="-8" rx="22" ry="24" fill="#FFFDF6"/>
          <g clip-path="url(#hwa-eye-clip-left)">
          <g id="pupil-left-rig" class="hwa-pupil-left-rig" inkscape:label="pupil left rig (pose offset)" transform="translate(1 -3)">
            <g id="pupil-left" class="hwa-pupil-left" inkscape:label="pupil left" data-anim="look (translate, max ±5px)" data-origin="-40 -8" style="transform-box:view-box;transform-origin:-40px -8px">
              <circle cx="-40" cy="-8" r="17" fill="url(#hwa-iris)"/>
              <circle cx="-40" cy="-8" r="10" fill="#1A0E08"/>
              <circle cx="-33" cy="-16" r="6.5" fill="#FFFFFF"/>
              <circle cx="-46" cy="-1" r="3" fill="#FFFFFF" opacity="0.85"/>
            </g>
          </g>
          </g>
          <ellipse cx="-40" cy="-8" rx="22" ry="24" fill="none" stroke="#3B2216" stroke-width="2.6"/>
        </g>
        <g id="eye-right" class="hwa-eye-right" inkscape:label="eye right" data-anim="blink (scaleY 1 -> 0.1 -> 1)" data-origin="40 -8" style="transform-box:view-box;transform-origin:40px -8px">
          <ellipse cx="40" cy="-8" rx="22" ry="24" fill="#FFFDF6"/>
          <g clip-path="url(#hwa-eye-clip-right)">
          <g id="pupil-right-rig" class="hwa-pupil-right-rig" inkscape:label="pupil right rig (pose offset)" transform="translate(1 -3)">
            <g id="pupil-right" class="hwa-pupil-right" inkscape:label="pupil right" data-anim="look (translate, max ±5px)" data-origin="40 -8" style="transform-box:view-box;transform-origin:40px -8px">
              <circle cx="40" cy="-8" r="17" fill="url(#hwa-iris)"/>
              <circle cx="40" cy="-8" r="10" fill="#1A0E08"/>
              <circle cx="47" cy="-16" r="6.5" fill="#FFFFFF"/>
              <circle cx="34" cy="-1" r="3" fill="#FFFFFF" opacity="0.85"/>
            </g>
          </g>
          </g>
          <ellipse cx="40" cy="-8" rx="22" ry="24" fill="none" stroke="#3B2216" stroke-width="2.6"/>
        </g>
        <g id="brow-left-rig" class="hwa-brow-left-rig" inkscape:label="brow left rig (pose)" transform="translate(0 -6)">
          <g id="brow-left" class="hwa-brow-left" inkscape:label="brow left" data-anim="raise (translateY -6px)" data-origin="-42 -44" style="transform-box:view-box;transform-origin:-42px -44px">
            <ellipse cx="-42" cy="-44" rx="10" ry="4.5" transform="rotate(-12 -42 -44)" fill="#D98A2E"/>
          </g>
        </g>
        <g id="brow-right-rig" class="hwa-brow-right-rig" inkscape:label="brow right rig (pose)" transform="translate(0 -6)">
          <g id="brow-right" class="hwa-brow-right" inkscape:label="brow right" data-anim="raise (translateY -6px)" data-origin="42 -44" style="transform-box:view-box;transform-origin:42px -44px">
            <ellipse cx="42" cy="-44" rx="10" ry="4.5" transform="rotate(12 42 -44)" fill="#D98A2E"/>
          </g>
        </g>
        <g id="nose" class="hwa-nose" inkscape:label="nose" data-anim="sniff (scale 1 -> 1.08)" data-origin="0 30" style="transform-box:view-box;transform-origin:0px 30px">
          <path d="M -18 26 C -18 15 18 15 18 26 C 18 36 7 44 0 44 C -7 44 -18 36 -18 26 Z" fill="url(#hwa-nose)"/>
          <ellipse cx="-6" cy="22" rx="6" ry="3" fill="#FFFFFF" opacity="0.45"/>
        </g>
        <g id="mouth" class="hwa-mouth" inkscape:label="mouth (excited)" data-anim="pant / talk (scaleY 0.9 -> 1.1)" data-origin="0 50" style="transform-box:view-box;transform-origin:0px 50px">
          <path d="M -30 48 C -20 62 -6 62 0 52 C 6 62 20 62 30 48 C 28 80 14 92 0 92 C -14 92 -28 80 -30 48 Z" fill="#6B2B22"/>
          <path d="M -14 70 C -14 63 14 63 14 70 C 14 88 7 97 0 97 C -7 97 -14 88 -14 70 Z" fill="url(#hwa-tongue)" stroke="#B5505F" stroke-width="2"/>
          <path d="M 0 71 V 84" stroke="#C25A6A" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M 0 44 V 52 M -32 46 C -22 60 -6 60 0 52 C 6 60 22 60 32 46" fill="none" stroke="#3B2216" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>
  </g>
</svg>
